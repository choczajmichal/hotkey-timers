name: Build unsigned Windows portable app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish portable x64 app (unsigned)
        shell: pwsh
        run: |
          dotnet publish Timerki/Timerki.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:ContinuousIntegrationBuild=true -o artifacts/portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE,README.md,CODE_SIGNING.md artifacts/portable/
          'UNSIGNED BUILD - not yet signed by SignPath Foundation.' | Set-Content artifacts/portable/SIGNING-STATUS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Timerki-windows-x64-unsigned
          path: artifacts/portable/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Timerki-windows-x64-unsigned
          path: portable
      - name: Package and publish unsigned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archiveName = "Timerki-$env:GITHUB_REF_NAME-windows-x64-unsigned.zip"
          Compress-Archive -Path portable/* -DestinationPath $archiveName
          $hash = (Get-FileHash $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content SHA256SUMS.txt -Encoding ascii
          $notes = Get-Content RELEASE-NOTES.md -Raw
          $notes += "`n`nSHA-256 ZIP: $hash`nSource commit: $env:GITHUB_SHA`n"
          $notes | Set-Content release-body.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $archiveName SHA256SUMS.txt --verify-tag --title "Timerki $env:GITHUB_REF_NAME (unsigned)" --notes-file release-body.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
